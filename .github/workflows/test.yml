name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testler
        run: python3 -m unittest discover -s tests -v
      - name: Paket tutarlılığı
        run: python3 scripts/paket-dogrula.py
      - name: dist/ güncel mi?
        run: |
          python3 scripts/tek-dosya-olustur.py
          git diff --exit-code -- dist/turkish-humanizer-tek-dosya.md
