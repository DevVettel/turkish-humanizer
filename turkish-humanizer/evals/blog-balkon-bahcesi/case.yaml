schema_version: "1.1"
name: blog-balkon-bahcesi
expected_outcome: |
  Blog registerında doğal bir metin. Başlık ve sayılar (6 saat, 20 litre) korunur. Kuzey balkon önerisinin temkinli dili (olabilir) korunur. Uzun çizgi, -mektedir yığılması, Günümüzde/Sonuç olarak/büyük önem taşımaktadır klişeleri ve Umarım kapanışı kalkar. Yalnızca düzeltilmiş metin verilir.
