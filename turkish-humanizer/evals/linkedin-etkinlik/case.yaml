schema_version: "1.1"
name: linkedin-etkinlik
expected_outcome: |
  Kişisel ama profesyonel bir LinkedIn gönderisi ve altında kısa bir değişiklik özeti. Bütün sayılar, etkinlik adı, konuşmacı adı ve unvanı, konuşma başlığı ve 4 hashtag aynen korunur. Günün sonunda, masaya yatırıldı gibi klişeler ve emoji bolluğu kalkar.
